<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10120f">
  <meta name="description" content="Na Qi — Just write code. Occasionally manage servers.">
  <title>Na Qi — Personal Site</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10120f;
      --panel: #151813;
      --text: #e5e8df;
      --muted: #858d7c;
      --line: #2b3126;
      --green: #b7e38a;
      --green-dim: #789b58;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(91, 120, 65, .09), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .shell {
      width: min(100% - 48px, 860px);
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 25px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .prompt { color: var(--green); }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 100px 0 120px;
    }
    .eyebrow {
      margin: 0 0 22px;
      color: var(--green-dim);
      font-size: 12px;
      letter-spacing: .12em;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 76px);
      font-weight: 500;
      line-height: 1.12;
      letter-spacing: -.075em;
    }
    h1 .cursor {
      display: inline-block;
      width: .09em;
      height: .82em;
      margin-left: .12em;
      background: var(--green);
      vertical-align: -.04em;
      animation: blink 1.15s steps(2, start) infinite;
    }
    .rule {
      width: 54px;
      height: 1px;
      margin: 34px 0 28px;
      background: var(--green-dim);
    }
    .tagline {
      max-width: 560px;
      margin: 0;
      color: #c3c9bb;
      font-size: clamp(15px, 2.3vw, 18px);
      line-height: 1.9;
    }
    .tagline .comment { color: var(--muted); }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
      margin-top: 42px;
    }
    .link {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 0;
      color: var(--green);
      text-decoration: none;
      border-bottom: 1px solid var(--green-dim);
      transition: color .2s, border-color .2s;
    }
    .link:hover, .link:focus-visible {
      color: #e0ffc0;
      border-color: #e0ffc0;
      outline: none;
    }
    .link .arrow { transition: transform .2s; }
    .link:hover .arrow { transform: translate(3px, -2px); }
    .signature {
      margin-top: 64px;
      color: var(--muted);
      font-size: 12px;
    }
    .signature span { color: var(--green-dim); }
    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 0 24px;
      border-top: 1px solid var(--line);
      color: #697061;
      font-size: 11px;
    }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media (max-width: 520px) {
      .shell { width: min(100% - 36px, 860px); }
      .topline { padding: 18px 0; font-size: 10px; }
      .main { padding: 76px 0 88px; }
      .signature { margin-top: 48px; }
      footer { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topline">
      <div><span class="prompt">~/</span> personal-space</div>
      <div>Na Qi <span class="prompt">●</span></div>
    </header>

    <main class="main">
      <p class="eyebrow">// hello, world</p>
      <h1>那琦<span class="cursor" aria-hidden="true"></span></h1>
      <div class="rule"></div>
      <p class="tagline">
        Just write code. Occasionally manage servers.<br>
        <span class="comment">// Build quietly. Keep exploring.</span>
      </p>

      <nav class="links" aria-label="Main links">
        <a class="link" href="https://civilization-os.github.io/docs/">
          <span>Read the Wiki</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="link" href="https://github.com/civilization-os">
          <span>GitHub profile</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>

      <p class="signature"><span>const</span> life = () =&gt; keep_building();</p>
    </main>

    <footer>
      <span>© <span id="year">2026</span> Na Qi</span>
      <span>Made with intention, not a framework.</span>
    </footer>
  </div>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
